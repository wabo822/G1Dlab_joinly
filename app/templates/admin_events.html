{% extends 'admin_base.html' %}
{% block title %}Activités — Administration{% endblock %}
{% block admin %}
<h1>Activités</h1>
<a href="{{ url_for('admin_events_csv') }}">Export CSV</a>
<form method="get"><input name="q" value="{{ request.args.get('q','') }}"><button>Chercher</button></form>
{% for row in rows %}
<p><a href="{{ url_for('admin_event_office', event_id=row.id) }}">{{ row.title }}</a> · {{ row.status }} · {{ row.organizer }}</p>
{% endfor %}
{% endblock %}
